# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  test:
    name: Build and test
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive RingLoom broker version
        id: broker
        shell: bash
        run: |
          version="$(sed -n 's/^ringloomJavaBindings = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          if [[ -z "$version" ]]; then
            echo "Could not read ringloomJavaBindings from gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The broker integration tests need the broker binary and the ringloom repo's
      # scripts/start-test-broker.sh, both taken from the matching ringloom release.
      - name: Check out RingLoom broker scripts
        uses: actions/checkout@v5
        with:
          repository: ringloom-io/ringloom
          ref: v${{ steps.broker.outputs.version }}
          path: .ringloom
          sparse-checkout: scripts

      - name: Download RingLoom broker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.broker.outputs.version }}"
          package="ringloom-broker-${version}-x86_64-linux"
          gh release download "v${version}" -R ringloom-io/ringloom -D .ringloom/dist \
            -p "${package}.tar.gz" -p "${package}.tar.gz.sha256"
          # The published checksum file records a dist/ path, so compare the hash only.
          expected="$(cut -d' ' -f1 ".ringloom/dist/${package}.tar.gz.sha256")"
          echo "${expected}  .ringloom/dist/${package}.tar.gz" | sha256sum -c -
          tar -xzf ".ringloom/dist/${package}.tar.gz" -C .ringloom/dist
          echo "RINGLOOM_BROKER_BIN=${{ github.workspace }}/.ringloom/dist/${package}/bin/ringloom-broker" >> "$GITHUB_ENV"

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Build and test
        run: >
          ./gradlew --no-daemon build
          -Pringloom.brokerBin=${{ env.RINGLOOM_BROKER_BIN }}
          -Pringloom.repoRoot=${{ github.workspace }}/.ringloom

  release:
    name: Release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Could not derive version from tag '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Derive RingLoom broker version
        id: broker
        shell: bash
        run: |
          version="$(sed -n 's/^ringloomJavaBindings = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          if [[ -z "$version" ]]; then
            echo "Could not read ringloomJavaBindings from gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out RingLoom broker scripts
        uses: actions/checkout@v5
        with:
          repository: ringloom-io/ringloom
          ref: v${{ steps.broker.outputs.version }}
          path: .ringloom
          sparse-checkout: scripts

      - name: Download RingLoom broker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.broker.outputs.version }}"
          package="ringloom-broker-${version}-x86_64-linux"
          gh release download "v${version}" -R ringloom-io/ringloom -D .ringloom/dist \
            -p "${package}.tar.gz" -p "${package}.tar.gz.sha256"
          # The published checksum file records a dist/ path, so compare the hash only.
          expected="$(cut -d' ' -f1 ".ringloom/dist/${package}.tar.gz.sha256")"
          echo "${expected}  .ringloom/dist/${package}.tar.gz" | sha256sum -c -
          tar -xzf ".ringloom/dist/${package}.tar.gz" -C .ringloom/dist
          echo "RINGLOOM_BROKER_BIN=${{ github.workspace }}/.ringloom/dist/${package}/bin/ringloom-broker" >> "$GITHUB_ENV"

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Build and test
        run: >
          ./gradlew --no-daemon build
          -Pringloom.version=${{ steps.version.outputs.version }}
          -Pringloom.brokerBin=${{ env.RINGLOOM_BROKER_BIN }}
          -Pringloom.repoRoot=${{ github.workspace }}/.ringloom

      - name: Stage release jars
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for module in \
              ringloom-framework-core \
              ringloom-framework-processor \
              ringloom-framework-yaml \
              ringloom-ioc-avaje \
              ringloom-metrics-opentelemetry \
              ringloom-serializer-fory \
              ringloom-serializer-sbe \
              ringloom-tracing-opentelemetry; do
            jar="${module}/build/libs/${module}-${version}.jar"
            if [[ ! -f "$jar" ]]; then
              echo "Missing release jar $jar" >&2
              exit 1
            fi
            cp "$jar" dist/
          done
          (cd dist && sha256sum *.jar > SHA256SUMS)

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: ringloom-framework-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon publishToMavenCentral
          -Pringloom.version=${{ steps.version.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
